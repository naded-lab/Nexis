name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install NDK + CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.3.11579264" "cmake;3.22.1"

      # First native build clones + compiles llama.cpp from source (FetchContent),
      # which is slow — cache it so later pushes are fast and don't hit GitHub rate limits.
      - name: Cache llama.cpp native build
        uses: actions/cache@v4
        with:
          path: nexis-android/app/.cxx
          key: llama-cxx-${{ runner.os }}-${{ hashFiles('nexis-android/app/src/main/cpp/CMakeLists.txt') }}

      - name: Build debug APK
        run: gradle -p nexis-android assembleDebug --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexis-debug-apk
          path: nexis-android/app/build/outputs/apk/debug/app-debug.apk
